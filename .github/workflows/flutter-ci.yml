name: Flutter CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --project-name=x12o .
      - run: flutter pub get
      - name: Remove generated starter test
        run: rm -f test/widget_test.dart
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
